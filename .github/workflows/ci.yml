name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Install LibreOffice for the round-trip tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          REQUIRE_LIBREOFFICE: "1"
